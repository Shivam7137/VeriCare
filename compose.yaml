name: patient-request-coordination
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: prc
      POSTGRES_PASSWORD: prc_local_only
      POSTGRES_DB: prc
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - prc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prc -d prc"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  prc_postgres_data:
