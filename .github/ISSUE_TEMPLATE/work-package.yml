name: Work package
description: Define an owned task with dependencies and evidence.
title: "[Package] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and first task
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner and reviewer
      description: Name both before implementation begins.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
  - type: textarea
    id: acceptance
    attributes:
      label: Completion evidence
    validations:
      required: true
